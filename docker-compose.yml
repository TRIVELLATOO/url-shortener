services:
  postgres:
    image: postgres:16
    container_name: shortener-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-shortener}
      POSTGRES_USER: ${DB_USER:-shortener}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shortener}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: shortener-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
