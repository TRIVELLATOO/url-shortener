spring:
  application:
    name: shortener

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shortener}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}

  jpa:
    # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com o banco.
    hibernate:
      ddl-auto: validate
    # Evita manter a conexão com o banco aberta durante toda a requisição HTTP.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Timeout curto: se o Redis travar, a requisição não fica esperando segundos.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_TIMEOUT:500ms}

server:
  port: ${SERVER_PORT:8080}

app:
  # Endereço público usado para montar a URL curta devolvida pela API.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    # Por quanto tempo um link fica guardado no Redis (ex.: 24h, 30m, 30s).
    link-ttl: ${LINK_CACHE_TTL:24h}

logging:
  level:
    # Use "debug" para ver no log o SQL executado e os HIT/MISS do cache.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    com.pablo.shortener.link.LinkCache: ${CACHE_LOG_LEVEL:info}
