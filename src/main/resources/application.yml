spring:
  application:
    name: shortener

  datasource:
    # DB_SSLMODE: "prefer" usa SSL se o servidor oferecer (local funciona sem). No Neon, use "require".
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shortener}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:shortener}
    password: ${DB_PASSWORD:shortener}
    hikari:
      # Poucas conexões: economiza memória e respeita o limite de conexões de bancos gratuitos.
      maximum-pool-size: ${DB_POOL_SIZE:5}

  jpa:
    # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem com o banco.
    hibernate:
      ddl-auto: validate
    # Evita manter a conexão com o banco aberta durante toda a requisição HTTP.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Vazios por padrão (Redis local sem senha). No Upstash: usuário "default" + senha do painel.
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        # O Upstash só aceita conexões com TLS.
        enabled: ${REDIS_SSL:false}
      # Timeout de cada comando: curto, para uma requisição não ficar esperando o Redis travado.
      # Atenção: a inicialização da conexão (aperto de mão TLS + autenticação) também usa este valor.
      # Com o Redis em outra rede (ex.: Upstash), 1s dá mais margem.
      timeout: ${REDIS_TIMEOUT:500ms}
      # Timeout só para abrir a conexão TCP.
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}

server:
  # O Render define a variável PORT; localmente, o padrão continua 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  # Atrás de um proxy (como o do Render), lê o IP real do cliente no X-Forwarded-For.
  # O Tomcat só confia nesse cabeçalho quando a conexão vem de um IP de rede interna
  # (10.x, 172.16-31.x, 192.168.x, 127.x...), e usa o IP mais à direita que não é de proxy,
  # então um cliente não consegue "inventar" outro IP mandando o próprio X-Forwarded-For.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    threads:
      # Menos threads = menos memória (cada thread reserva uma pilha). Suficiente para um projeto pequeno.
      max: ${TOMCAT_MAX_THREADS:50}

management:
  endpoints:
    web:
      exposure:
        # Só o /actuator/health fica público; os outros endpoints do Actuator ficam desligados.
        include: health
  endpoint:
    health:
      # Responde só {"status":"UP"}, sem expor detalhes da infraestrutura.
      show-details: never
  health:
    # A aplicação funciona sem o Redis (cache e rate limit são opcionais), então uma falha
    # no Redis não deve marcar a aplicação como fora do ar e fazer o Render reiniciá-la.
    redis:
      enabled: false

app:
  # Endereço público usado para montar a URL curta devolvida pela API.
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    # Por quanto tempo um link fica guardado no Redis (ex.: 24h, 30m, 30s).
    link-ttl: ${LINK_CACHE_TTL:24h}
  stats:
    # Fuso usado para decidir em que "dia" cada clique caiu nas estatísticas.
    zone: ${STATS_ZONE:America/Sao_Paulo}
  rate-limit:
    # Quantos links um mesmo IP pode criar por janela de tempo.
    max-creations: ${RATE_LIMIT_MAX_CREATIONS:10}
    window: ${RATE_LIMIT_WINDOW:1m}
  client-ip:
    # Cabeçalho com o IP real do cliente, preenchido por um proxy confiável que SOBRESCREVE o valor
    # (ex.: CF-Connecting-IP, quando toda requisição passa pela Cloudflare, como no Render).
    # Vazio = usar o IP da conexão. Nunca configure um cabeçalho que o cliente consiga enviar direto.
    header: ${CLIENT_IP_HEADER:}
    # Diagnóstico temporário: loga os cabeçalhos de IP a cada criação de link.
    log-headers: ${LOG_CLIENT_IP_HEADERS:false}

logging:
  level:
    # Use "debug" para ver no log o SQL executado e os HIT/MISS do cache.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}
    com.pablo.shortener.link.LinkCache: ${CACHE_LOG_LEVEL:info}
    # Use "debug" para ver qual IP o rate limit está usando (útil para conferir o proxy).
    com.pablo.shortener.ratelimit: ${RATE_LIMIT_LOG_LEVEL:info}
